[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-observatory"
version = "0.1.0"
description = "A local-first workbench for LLM evaluations, traces, and release gates."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "httpx>=0.27,<1", "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2", "opentelemetry-exporter-otlp-proto-http>=1.29,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
observatory = "observatory.cli:main"

[tool.setuptools.packages.find]
include = ["observatory*"]

[tool.setuptools.package-data]
observatory = ["static/*", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
